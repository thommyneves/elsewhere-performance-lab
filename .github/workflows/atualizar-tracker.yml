name: Atualizar dados do Tracker

on:
  workflow_dispatch:

  schedule:
    # Executa a cada 6 horas, no minuto 17.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-tracker
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas beautifulsoup4 openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Coletar dados do Tracker
        env:
          CI: "false"
        run: |
          xvfb-run --auto-servernum python puxar_tracker.py

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-tracker
          path: |
            dados_tracker/debug_agente.html
            dados_tracker/debug_agente.png
            dados_tracker/debug_mapa.html
            dados_tracker/debug_mapa.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verificar dados coletados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          arquivo = Path("dados_tracker/tracker_dados.json")

          if not arquivo.exists():
              raise SystemExit(
                  "O arquivo dados_tracker/tracker_dados.json não foi criado."
              )

          dados = json.loads(arquivo.read_text(encoding="utf-8"))

          agentes = dados.get("agentes", [])
          mapas = dados.get("mapas", [])

          print(f"Agentes encontrados: {len(agentes)}")
          print(f"Mapas encontrados: {len(mapas)}")

          if not agentes and not mapas:
              raise SystemExit(
                  "A coleta não encontrou agentes nem mapas. "
                  "Consulte o artefato diagnostico-tracker."
              )
          PY

      - name: Gerar análises
        run: |
          python analisar_tracker.py

      - name: Verificar arquivo do dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          arquivo = Path(
              "elsewhere-performance-lab-source/public/tracker_insights.json"
          )

          if not arquivo.exists():
              raise SystemExit(
                  "O arquivo público tracker_insights.json não foi criado."
              )

          dados = json.loads(arquivo.read_text(encoding="utf-8"))

          if not dados.get("agentes") or not dados.get("mapas"):
              raise SystemExit(
                  "O tracker_insights.json foi criado sem agentes ou mapas."
              )

          print("Arquivo do dashboard validado com sucesso.")
          PY

      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados_tracker/tracker_dados.json
          git add dados_tracker/tracker_insights.json
          git add dados_tracker/tracker_agentes.csv
          git add dados_tracker/tracker_mapas.csv
          git add dados_tracker/tracker_dados.xlsx
          git add elsewhere-performance-lab-source/public/tracker_insights.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração foi encontrada."
          else
            git commit -m "Atualiza dados automáticos do Tracker"
            git push
          fi